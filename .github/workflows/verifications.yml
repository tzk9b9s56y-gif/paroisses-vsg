name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: cs2pr

      # Une erreur de syntaxe casserait le site.
      - name: Syntaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      # Le site refuse d'installer une version dont la feuille de style est vide ou tronquée.
      - name: Feuille de style complète
        run: |
          test "$(wc -c < style.css)" -gt 20000
          grep -q '^Theme Name:' style.css
          grep -Eq '^Version: [0-9]+\.[0-9]+\.[0-9]+$' style.css

      # Règles de codage WordPress (phpcs.xml.dist) : sécurité, nommage, mise en forme. Zéro écart exigé.
      # Outils figés aux versions utilisées pour mettre le code au propre, pris directement sur GitHub.
      - name: Règles de codage WordPress (PHPCS)
        run: |
          mkdir -p "$RUNNER_TEMP/phpcs" && cd "$RUNNER_TEMP/phpcs"
          git clone -q --depth 1 --branch 3.13.2 https://github.com/PHPCSStandards/PHP_CodeSniffer.git phpcs
          git clone -q --depth 1 --branch 3.1.0  https://github.com/WordPress/WordPress-Coding-Standards.git wpcs
          git clone -q --depth 1 --branch 1.0.12 https://github.com/PHPCSStandards/PHPCSUtils.git utils
          git clone -q --depth 1 --branch 1.2.1  https://github.com/PHPCSStandards/PHPCSExtra.git extra
          php phpcs/bin/phpcs --config-set installed_paths "$PWD/wpcs,$PWD/utils,$PWD/extra" > /dev/null
          cd "$GITHUB_WORKSPACE"
          # -q : sans la note de dépréciation de PHPCS, qui casserait le format checkstyle lu par cs2pr.
          php "$RUNNER_TEMP/phpcs/phpcs/bin/phpcs" -q --report=checkstyle | cs2pr
