name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr

      # Une erreur de syntaxe casserait le site.
      - name: Syntaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      # Le site refuse d'installer une version dont la feuille de style est vide ou tronquée.
      - name: Feuille de style complète
        run: |
          test "$(wc -c < style.css)" -gt 20000
          grep -q '^Theme Name:' style.css
          grep -Eq '^Version: [0-9]+\.[0-9]+\.[0-9]+$' style.css

      # Règles de codage WordPress (phpcs.xml.dist) : sécurité, nommage, mise en forme. Zéro écart exigé.
      # Version des règles figée (3.1.0) : la même que celle utilisée pour mettre le code au propre.
      - name: Règles de codage WordPress (PHPCS)
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --quiet wp-coding-standards/wpcs:3.1.0 dealerdirect/phpcodesniffer-composer-installer
          PHPCS="$(composer global config home)/vendor/bin/phpcs"
          "$PHPCS" -i
          # -q : sans la note de dépréciation de PHPCS, qui casserait le format checkstyle lu par cs2pr.
          "$PHPCS" -q --report=checkstyle | cs2pr
